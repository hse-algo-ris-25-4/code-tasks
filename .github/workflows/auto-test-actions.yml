# Срабатывает на pull request в main и в main-task-* (не в студенческую ветку как base).
# Тип edited нужен, чтобы при смене base (main → main-task-1) Checks запустились снова.
# Правка только заголовка PR не гоняет тесты (фильтр на job).
# Шаги:
# - если base не main-task-*: комментарий в PR и красный Check;
# - ruff: сборка падает только на синтаксисе и неопределённых именах;
#   замечания по стилю не валят Checks (--exit-zero), их смотрят на ревью;
# - unittest: если есть test_runner.py — он, иначе поиск test*.py по дереву репозитория;
# - лимит 5 минут.
#
name: Python auto testing

on:
  pull_request:
    branches:
      - main
      - "main-task-*"
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Проверить ветку назначения
      id: base
      env:
        BASE: ${{ github.base_ref }}
      run: |
        if [[ "$BASE" == main-task-* ]]; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "::error::Pull request открыт в ветку «${BASE}». Нужна ветка задания main-task-N (например main-task-1), не main. На странице PR: Edit рядом с base → выбрать main-task-… Новый PR создавать не нужно."
        fi

    - name: Комментарий — неверная ветка base
      if: steps.base.outputs.ok != 'true'
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          const marker = '<!-- algo-wrong-base -->';
          const base = context.payload.pull_request.base.ref;
          const body = [
            marker,
            '⚠️ Этот pull request открыт в ветку `' + base + '`.',
            '',
            'Для программных заданий поле **base** должно быть веткой задания: `main-task-1`, `main-task-3-v11` и т.д., **не** `main`.',
            '',
            'Как исправить: на странице PR нажмите **Edit** рядом с base, выберите нужный `main-task-…` и сохраните. Новый pull request создавать не нужно.',
            '',
            'Инструкция: https://github.com/hse-algo-ris-25-4/docs/blob/main/submitting-code-task.md',
          ].join('\n');

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          if (comments.some((c) => c.body && c.body.includes(marker))) {
            return;
          }
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body,
          });

    - name: Остановить сборку — неверная ветка base
      if: steps.base.outputs.ok != 'true'
      run: exit 1

    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: python -m pip install -r requirements.txt
    - name: Lint with ruff
      run: |
        ruff check . --select E9,F63,F7,F82
        ruff check . --exit-zero
    - name: Test with unittest module
      run: |
        if [ -f test_runner.py ]; then
          python -m unittest test_runner.py -v
        else
          python -m unittest discover -s . -p "test*.py" -v
        fi
